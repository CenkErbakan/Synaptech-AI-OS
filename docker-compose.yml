# SynapTech AI OS — yalnızca yerel geliştirme
# Mevcut SQLEXPRESS / diğer proje container'larına dokunmaz.
# Host 1433 meşgul olduğu için 14333 kullanılır.

name: synaptech-ai-os

services:
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: synaptech-ai-os-mssql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD}"
      MSSQL_PID: "Developer"
    ports:
      - "127.0.0.1:14333:1433"
    volumes:
      - synaptech_ai_os_mssql_data:/var/opt/mssql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q \"SELECT 1\" || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 40s
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: synaptech-ai-os-api
    depends_on:
      mssql:
        condition: service_healthy
    environment:
      NODE_ENV: development
      HOST: 0.0.0.0
      PORT: "3101"
      DATABASE_URL: "sqlserver://mssql:1433;database=SynaptechAiOs;user=sa;password=${MSSQL_SA_PASSWORD};encrypt=true;trustServerCertificate=true"
      SYNAPTECH_OWNER_TOKEN: "${SYNAPTECH_OWNER_TOKEN}"
      SYNAPTECH_SYSTEM_TOKEN: "${SYNAPTECH_SYSTEM_TOKEN}"
      SYNAPTECH_REPO_ROOT: /app
      KILL_SWITCH_FILE: /app/config/kill-switch.json
    ports:
      - "127.0.0.1:3101:3101"
    volumes:
      - ./config:/app/config:rw
      - ./apps/api:/app/apps/api
      - ./packages:/app/packages
    profiles:
      - with-api

volumes:
  synaptech_ai_os_mssql_data:
    name: synaptech_ai_os_mssql_data
